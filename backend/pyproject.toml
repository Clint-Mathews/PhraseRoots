[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.0.0",
    "google-auth>=2.0.0",
    "faster-whisper>=1.2.1",
    "pydantic-settings>=2.15.0",
    "PyJWT>=2.10.1",
    "pythainlp>=5.3.7",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.53.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
